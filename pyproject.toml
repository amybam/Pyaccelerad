[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaccelerad"
version = "0.1.1"
description = "Python interface for Accelerad, mimicking Pyradiance."
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
authors = [
  {name = "Kevin Huberty"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "pyradiance", 
]

[project.urls]
"Homepage" = "https://github.com/amybam/Pyaccelerad" 
